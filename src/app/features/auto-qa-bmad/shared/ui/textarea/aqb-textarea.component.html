<div class="aqb-textarea">
  <label class="aqb-textarea__label" [for]="inputId()">{{ label() }}</label>
  <textarea
    class="aqb-textarea__field"
    [id]="inputId()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? errorId() : null"
    (input)="onInput($event)"
    >{{ value() }}</textarea
  >
  @if (error()) {
    <p class="aqb-textarea__error" [id]="errorId()">{{ error() }}</p>
  }
</div>

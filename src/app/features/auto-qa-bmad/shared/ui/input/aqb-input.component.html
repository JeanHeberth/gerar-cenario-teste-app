<div class="aqb-input">
  <label class="aqb-input__label" [for]="inputId()">{{ label() }}</label>
  <input
    class="aqb-input__field"
    [id]="inputId()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.aria-invalid]="hasError()"
    [attr.aria-describedby]="hasError() ? errorId() : null"
    (input)="onInput($event)"
  />
  @if (error()) {
    <p class="aqb-input__error" [id]="errorId()">{{ error() }}</p>
  }
</div>

<div class="execution-detail-page">
  <a routerLink="/auto-qa" class="execution-detail-page__back">← Voltar</a>

  @if (state.error()) {
    <p class="execution-detail-page__error" role="alert">{{ state.error() }}</p>
  }

  @if (state.actionError()) {
    <p class="execution-detail-page__error" role="alert">{{ state.actionError() }}</p>
  }

  @if (state.loading() && !state.current()) {
    <aqb-loading label="Carregando execução..." />
  }

  @if (state.current(); as execution) {
    <aqb-page-header [title]="execution.scenario">
      <aqb-status-chip [status]="execution.status" />
      <aqb-button
        class="execution-detail-page__refresh"
        variant="secondary"
        [disabled]="!state.canRefresh()"
        (clicked)="onRefresh()"
      >
        Atualizar
      </aqb-button>
    </aqb-page-header>

    <app-workflow-overview [execution]="execution" />

    <div class="execution-detail-page__main">
      <app-stage-timeline
        class="execution-detail-page__timeline"
        [execution]="execution"
        [selectedStage]="selectedStage()"
        (stageSelected)="onStageSelected($event)"
      />

      <app-stage-detail-panel
        class="execution-detail-page__detail"
        [metadata]="selectedStageMetadata()"
        [state]="selectedStageVisualState()"
        [execution]="execution"
      />
    </div>

    <div class="execution-detail-page__footer">
      <app-execution-summary [execution]="execution" />

      <app-warning-list [warnings]="state.currentWarnings()" />

      <app-error-list [errors]="state.currentErrors()" />

      <app-action-bar
        [availableActions]="state.currentAvailableActions()"
        [pendingAction]="state.pendingAction()"
        (actionTriggered)="onActionTriggered($event)"
      />

      @if (showApplyApprovalPanel()) {
        <app-apply-approval-panel [submitting]="state.pendingAction() === 'APPROVE_FILE_UPDATE'" (approved)="onApplyApproved($event)" />
      }

      @if (showExecutionApprovalPanel()) {
        <app-execution-approval-panel
          [submitting]="state.pendingAction() === 'APPROVE_EXECUTION'"
          (approved)="onExecutionApproved($event)"
        />
      }
    </div>

    <app-apply-confirm-modal
      [open]="showApplyConfirm()"
      [submitting]="state.pendingAction() === 'APPLY'"
      (confirmed)="onApplyConfirmed()"
      (dismissed)="onApplyDismissed()"
    />

    <app-execute-confirm-modal
      [open]="showExecuteConfirm()"
      [submitting]="state.pendingAction() === 'EXECUTE'"
      (confirmed)="onExecuteConfirmed()"
      (dismissed)="onExecuteDismissed()"
    />

    <app-cancel-confirm-modal
      [open]="showCancelModal()"
      [submitting]="state.pendingAction() === 'CANCEL'"
      (confirmed)="onCancelConfirmed($event)"
      (dismissed)="onCancelDismissed()"
    />
  }
</div>

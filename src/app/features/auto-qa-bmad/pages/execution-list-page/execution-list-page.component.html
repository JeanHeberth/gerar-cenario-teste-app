<div class="execution-list-page">
  <div class="execution-list-page__content">
  <aqb-page-header
    title="Histórico de execuções"
    subtitle="Execuções anteriores do Auto QA BMAD, na ordem retornada pela API."
  />

  <app-new-execution-form [submitting]="state.creating()" (created)="onCreate($event)" />

  @if (state.error()) {
    <div class="execution-list-page__error" role="alert">
      <p>{{ state.error() }}</p>
      <aqb-button variant="secondary" (clicked)="onRetryList()">Tentar novamente</aqb-button>
    </div>
  }

  @if (state.loading()) {
    <div class="execution-list-page__grid execution-list-page__skeleton" role="status" aria-label="Carregando execuções...">
      <span class="aq-sr-only">Carregando execuções...</span>
      <aqb-skeleton variant="block" />
      <aqb-skeleton variant="block" />
      <aqb-skeleton variant="block" />
    </div>
  } @else if (!state.hasExecutions()) {
    <aqb-empty-state title="Nenhuma execução disponível." description="Crie a primeira execução preenchendo o formulário acima." />
  } @else {
    <div class="execution-list-page__grid">
      @for (execution of state.list(); track execution.executionId) {
        <a class="execution-list-page__item" [routerLink]="[execution.executionId]">
          <app-execution-card [execution]="execution" />
        </a>
      }
    </div>

    <div class="execution-list-page__pagination">
      <aqb-button
        class="execution-list-page__prev"
        variant="secondary"
        [disabled]="!canGoPrevious()"
        (clicked)="goToPreviousPage()"
      >
        Anterior
      </aqb-button>
      <span>Página {{ state.pagination().page + 1 }}</span>
      <aqb-button
        class="execution-list-page__next"
        variant="secondary"
        [disabled]="!canGoNext()"
        (clicked)="goToNextPage()"
      >
        Próxima
      </aqb-button>
    </div>
  }
  </div>
</div>

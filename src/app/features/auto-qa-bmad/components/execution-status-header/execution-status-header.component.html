<div
  class="execution-status-header"
  [class]="'execution-status-header--' + metadata().tone"
  role="status"
  [attr.aria-label]="metadata().label"
>
  <span class="execution-status-header__icon" aria-hidden="true">
    @switch (metadata().icon) {
      @case ('check-circle') {
        <svg viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      }
      @case ('x-circle') {
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      }
      @case ('ban') {
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      }
      @case ('lock') {
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      }
      @case ('loader') {
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
          <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
          <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
      }
    }
  </span>

  <div class="execution-status-header__text">
    <p class="execution-status-header__label">{{ metadata().label }}</p>
    <p class="execution-status-header__description">{{ metadata().description }}</p>
  </div>
</div>

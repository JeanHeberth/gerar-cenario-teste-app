<aqb-panel title="Aprovar aplicação de arquivos" class="apply-approval-panel">
  <aqb-input
    label="Aprovado por"
    [value]="approvedBy()"
    placeholder="Seu nome"
    (valueChange)="onApprovedByChange($event)"
  />

  <fieldset class="apply-approval-panel__fieldset">
    <legend>Operações autorizadas</legend>
    @for (operation of operations; track operation) {
      <label class="apply-approval-panel__checkbox">
        <input
          type="checkbox"
          [value]="operation"
          [checked]="isOperationSelected(operation)"
          (change)="toggleOperation(operation, $any($event.target).checked)"
        />
        {{ operation }}
      </label>
    }
  </fieldset>

  <label class="apply-approval-panel__checkbox">
    <input
      type="checkbox"
      name="allowFileUpdate"
      [checked]="allowFileUpdate()"
      (change)="allowFileUpdate.set($any($event.target).checked)"
    />
    Permitir sobrescrever arquivos que já existem
  </label>

  <label class="apply-approval-panel__checkbox">
    <input
      type="checkbox"
      name="allowWarnings"
      [checked]="allowWarnings()"
      (change)="allowWarnings.set($any($event.target).checked)"
    />
    Aplicar mesmo com avisos da revisão (problemas graves continuam bloqueando)
  </label>

  <span class="apply-approval-panel__submit">
    <aqb-button type="button" variant="primary" [loading]="submitting()" [disabled]="!canSubmit() || submitting()" (clicked)="onSubmit()">
      Aprovar aplicação
    </aqb-button>
  </span>
</aqb-panel>

<aqb-modal [open]="open()" title="Executar testes" (closed)="onDismiss()">\n  <p class="execute-confirm-modal__warning">\n    Esta ação iniciará a execução dos testes no projeto. A operação pode levar algum tempo; o resultado será determinado pelo backend.\n  </p>\n\n  <div class="execute-confirm-modal__actions">\n    <span class="execute-confirm-modal__dismiss">\n      <aqb-button variant="secondary" (clicked)="onDismiss()">Voltar</aqb-button>\n    </span>\n    <span class="execute-confirm-modal__confirm">\n      <aqb-button variant="primary" [loading]="submitting()" [disabled]="submitting()" (clicked)="onConfirm()">\n        Confirmar execução\n      </aqb-button>\n    </span>\n  </div>\n</aqb-modal>

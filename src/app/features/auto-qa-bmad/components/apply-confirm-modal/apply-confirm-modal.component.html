<aqb-modal [open]="open()" title="Aplicar alterações" (closed)="onDismiss()">\n  <p class="apply-confirm-modal__warning">\n    Arquivos poderão ser criados ou alterados no projeto. A operação usará a aprovação já registrada.\n    Backup e rollback são responsabilidade do backend.\n  </p>\n\n  <div class="apply-confirm-modal__actions">\n    <span class="apply-confirm-modal__dismiss">\n      <aqb-button variant="secondary" (clicked)="onDismiss()">Voltar</aqb-button>\n    </span>\n    <span class="apply-confirm-modal__confirm">\n      <aqb-button variant="danger" [loading]="submitting()" [disabled]="submitting()" (clicked)="onConfirm()">\n        Confirmar aplicação\n      </aqb-button>\n    </span>\n  </div>\n</aqb-modal>

<div class="execution-inspection-panel">
  <div class="execution-inspection-panel__tablist" role="tablist" aria-label="Recursos de inspeção da execução">
    @for (tab of tabs; track tab.id; let i = $index) {
      <button
        #tabButton
        type="button"
        class="execution-inspection-panel__tab"
        role="tab"
        [id]="'inspection-tab-' + tab.id"
        [attr.aria-selected]="selected() === tab.id"
        [attr.aria-controls]="'inspection-panel-' + tab.id"
        [tabindex]="selected() === tab.id ? 0 : -1"
        (click)="selectTab(tab.id)"
        (keydown)="onKeydown($event, i)"
      >
        <span class="execution-inspection-panel__tab-icon" aria-hidden="true">
          @switch (tab.icon) {
            @case ('clipboard-list') {
              <svg viewBox="0 0 24 24">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <path d="M9 3v3h6V3"></path>
                <line x1="8" y1="11" x2="16" y2="11"></line>
                <line x1="8" y1="15" x2="16" y2="15"></line>
              </svg>
            }
            @case ('file-text') {
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="8" y1="13" x2="16" y2="13"></line>
                <line x1="8" y1="17" x2="16" y2="17"></line>
              </svg>
            }
            @case ('code') {
              <svg viewBox="0 0 24 24">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
            }
            @case ('file-check') {
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <polyline points="9 15 11 17 15 13"></polyline>
              </svg>
            }
          }
        </span>
        {{ tab.label }}
      </button>
    }
  </div>

  @if (selected() === 'RESUMO') {
    <div
      class="execution-inspection-panel__panel"
      role="tabpanel"
      id="inspection-panel-RESUMO"
      aria-labelledby="inspection-tab-RESUMO"
      tabindex="0"
    >
      <app-execution-result-summary [execution]="execution()" />
    </div>
  }

  @if (selected() === 'GENERATED_FILES') {
    <div
      class="execution-inspection-panel__panel"
      role="tabpanel"
      id="inspection-panel-GENERATED_FILES"
      aria-labelledby="inspection-tab-GENERATED_FILES"
      tabindex="0"
    >
      <aqb-empty-state [title]="generatedFilesUnavailableMessage" />
    </div>
  }

  @if (selected() === 'DIFF') {
    <div
      class="execution-inspection-panel__panel"
      role="tabpanel"
      id="inspection-panel-DIFF"
      aria-labelledby="inspection-tab-DIFF"
      tabindex="0"
    >
      <aqb-empty-state [title]="diffUnavailableMessage" />
    </div>
  }

  @if (selected() === 'LOGS') {
    <div
      class="execution-inspection-panel__panel"
      role="tabpanel"
      id="inspection-panel-LOGS"
      aria-labelledby="inspection-tab-LOGS"
      tabindex="0"
    >
      <aqb-empty-state [title]="logsUnavailableMessage" />
    </div>
  }
</div>

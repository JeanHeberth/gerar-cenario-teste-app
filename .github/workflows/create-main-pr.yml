name: Criar PR Develop para Main

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  criar-pr:
    name: Criar PR automático develop -> main
    runs-on: ubuntu-latest

    # Só executa se o PR para a develop tiver sido mesclado com sucesso
    if: github.event.pull_request.merged == true

    steps:
      - name: Criar PR develop -> main (se ainda não existir e houver diferenças)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Já existe um PR aberto develop -> main (#$existing). Nada a fazer."
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "Merge automático: develop -> main (PR #${{ github.event.pull_request.number }})" \
            --body "PR criado automaticamente após o merge do PR #${{ github.event.pull_request.number }} na branch develop." \
          || echo "Não foi possível criar o PR (provavelmente sem diferenças entre develop e main neste momento)."

name: Auto Merge Develop para Main (Angular)

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  build-and-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificar Lint (Opcional)
        run: npm run lint --if-present

      - name: Executar o Build do Angular
        run: npm run build -- --configuration=production

      - name: Configurar o Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: |
          git checkout main
          git pull origin main
          git merge origin/develop --no-ff -m "Automated merge: develop into main (PR #${{ github.event.pull_request.number }})"
          git push origin main

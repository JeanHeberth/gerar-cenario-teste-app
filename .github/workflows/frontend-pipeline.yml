name: Frontend Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Executar testes unitarios"
        required: false
        default: false
        type: boolean

  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: frontend-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  build:
    name: Frontend Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-gerar-cenario-teste-app
          path: dist/gerar-cenario-teste-app
          if-no-files-found: error

  e2e:
    name: Frontend E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # MongoDB efêmero (Fase 13.6) — isolado, sem credencial, descartado ao
    # final do job. Nunca o cluster Atlas real (MONGO_URI_NUVEM de
    # produção/dev não é usado aqui, nem como secret).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      # Origem real do Angular servido pelo Playwright neste job — nunca
      # wildcard. Mesma política fail-closed da Fase 13.1B, só configurada
      # externamente (CorsConfig.java não é tocado).
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
      # Único diretório que o Happy Path real (create-execution.spec.ts)
      # usa — política fail-closed da Fase 13.1A, configurada externamente
      # (ProjectPathSecurityValidator.java não é tocado).
      AUTO_QA_ALLOWED_ROOTS: /tmp/projeto-e2e
      # Mongo efêmero do service container acima — sem credencial, não é
      # secret. O binding existente (spring.data.mongodb.uri) é reutilizado
      # sem nenhuma alteração em application.yml.
      MONGO_URI_NUVEM: mongodb://localhost:27017

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # Repositório backend é público — checkout de leitura sem token
      # adicional, sem PAT, sem secret. Ref fixa em "main" (branch mais
      # estável disponível hoje; ainda não é um SHA imutável — dívida
      # registrada no relatório desta fase).
      - name: Checkout backend (público, ref main)
        uses: actions/checkout@v4
        with:
          repository: JeanHeberth/criar-cenario-testes
          ref: main
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create E2E fixture directory
        run: mkdir -p /tmp/projeto-e2e

      # Backend real em background — nunca mockado (item 3 da aprovação).
      # PID capturado para permitir encerramento controlado no step
      # "Stop backend" (always()), evitando processo órfão no runner.
      - name: Start backend (background)
        working-directory: backend
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun > "${{ github.workspace }}/backend-e2e.log" 2>&1 &
          echo $! > "${{ github.workspace }}/backend.pid"

      # Sem /actuator/health (confirmado no diagnóstico) — readiness real
      # via endpoint de negócio, que comprova simultaneamente Tomcat de
      # pé, CORS configurado e MongoDB acessível. Falha explícita (exit 1)
      # se o backend não ficar pronto — nunca um sleep fixo arbitrário.
      - name: Wait for backend readiness
        run: |
          ready=false
          for i in $(seq 1 40); do
            http_status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Origin: http://localhost:4200" \
              "http://localhost:8089/api/auto-qa/executions?page=0&size=1" || true)
            if [ "$http_status" = "200" ]; then
              echo "Backend pronto (HTTP 200) após $i tentativa(s)."
              ready=true
              break
            fi
            echo "Aguardando backend... tentativa $i/40 (status=$http_status)"
            sleep 3
          done
          if [ "$ready" != "true" ]; then
            echo "Backend não ficou pronto a tempo (timeout)."
            echo "--- backend-e2e.log (últimas 200 linhas) ---"
            tail -n 200 "${{ github.workspace }}/backend-e2e.log" || true
            exit 1
          fi

      - name: Run E2E
        run: npx playwright test

      - name: Upload Playwright artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Upload backend log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          if-no-files-found: ignore

      # always() — o backend precisa ser encerrado mesmo se o Playwright
      # falhar, para nunca deixar processo órfão no runner.
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
